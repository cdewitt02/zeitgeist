# RSS feeds the headlines app polls every 3 minutes. Each item's link must be on a domain in
# news-domains.yaml, or it's skipped. Prefer an outlet's politics feed over its main feed, and check
# that item links point at the article itself, not a redirect.
#
# Outlets in news-domains.yaml with no feed here still count for URL matching. Checked 2026-10-27:
#   Houston Chronicle, San Antonio Express-News, Austin American-Statesman (Hearst): no feeds published
#   The Dallas Morning News: no feeds published
#   KERA News: refuses non-browser clients (403)
feeds:
  # Not /feeds/main/: it goes through FeedPress, whose item links are click-tracking redirects
  # (feeds.texastribune.org/link/...) that never match the article links in posts.
  - outlet: The Texas Tribune
    url: https://www.texastribune.org/topics/politics/feed/
  - outlet: The Texas Tribune
    url: https://www.texastribune.org/topics/immigration/feed/
  - outlet: The Texas Tribune
    url: https://www.texastribune.org/topics/health-care/feed/
  - outlet: The Texas Tribune
    url: https://www.texastribune.org/topics/energy/feed/
  - outlet: Houston Public Media
    url: https://www.houstonpublicmedia.org/topics/news/politics/feed/
  - outlet: Texas Public Radio
    url: https://www.tpr.org/tags/politics.rss
  - outlet: KUT
    url: https://www.kut.org/politics.rss
  - outlet: Texas Standard
    url: https://www.texasstandard.org/feed/
  - outlet: El Paso Matters
    url: https://elpasomatters.org/feed/
  - outlet: The Texas Observer
    url: https://www.texasobserver.org/feed/
